spring.jersey.application-path=/agency
spring.jersey.servlet.load-on-startup=1
server.address=127.0.0.1
server.port=${AGENCY_INSTANCE_PORT:8445}
server.ssl.enabled=true
server.ssl.key-store=file:${AGENCY_TLS_DIR}/keystore.p12
server.ssl.key-store-type=PKCS12
spring.config.import=configtree:${AGENCY_TLS_DIR}/
server.ssl.key-store-password=${keystore.password}
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
spring.ssl.bundle.pem.flats.truststore.certificate=file:${FLATS_CERTIFICATE}
agency.flats-public-base-url=${FLATS_PUBLIC_BASE_URL:https://localhost:8443}
agency.allowed-origin=${AGENCY_ALLOWED_ORIGIN:https://localhost:8443}
agency.connect-timeout=3s
agency.request-timeout=5s
