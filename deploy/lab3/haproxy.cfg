global
    maxconn 256

defaults
    mode http
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend agency
    bind "127.0.0.1:${AGENCY_HTTPS_PORT}" ssl crt "${AGENCY_TLS_DIR}/haproxy.pem" ssl-min-ver TLSv1.2
    default_backend agency_instances

backend agency_instances
    balance roundrobin
    option httpchk
    http-check send meth GET uri /agency/get-cheapest/1/1 ver HTTP/1.1 hdr Host localhost
    http-check expect status 303
    http-response set-header X-Agency-Instance %[srv_name]
    default-server inter 2s fall 2 rise 1 ssl verify required ca-file "${AGENCY_TLS_DIR}/agency.crt" verifyhost localhost
    server agency-1 "127.0.0.1:${AGENCY_PORT_1}" check
    server agency-2 "127.0.0.1:${AGENCY_PORT_2}" check
