openapi: 3.0.3
info:
  title: Flat Collection Service
  version: 1.0.0
  description: API для управления коллекцией квартир.
tags:
  - name: Flats
    description: Управление квартирами
  - name: Statistics
    description: Поиск по дате создания и новизне, подсчёт по транспорту
paths:
  /flats:
    get:
      tags:
        - Flats
      operationId: listFlats
      summary: Получить страницу квартир
      description: |
        Возвращает массив квартир: сначала фильтрует, затем сортирует и выбирает страницу.

        - Если страница пуста или выходит за пределы списка, возвращает `[]`.
        - Параметры, кроме `sort`, нельзя повторять.
      parameters:
        - name: page
          in: query
          description: Номер страницы, начиная с 1
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: size
          in: query
          description: Количество квартир на странице
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 20
        - name: sort
          in: query
          description: |
            Поля сортировки в порядке приоритета. Пример: `sort=area:asc&sort=name:desc`.

            **Как задать сортировку**

            - `asc` — по возрастанию, `desc` — по убыванию.
            - Доступны все поля `Flat` и вложенные пути через точку, например `house.year`.
            - Повтор поля — `400`.
            - По умолчанию — `id:asc`. При равенстве значений он служит последним ключом, если `id` не указан явно.

            **Порядок значений**

            - Строки сортируются по Unicode с учётом регистра.
            - `false` перед `true`; enum — в порядке объявления. `null` всегда в конце.
            - `coordinates` — последовательно по `x`, `y`.
            - `house` — по `name`, `year`, `numberOfFloors`, `numberOfFlatsOnFloor`, `numberOfLifts`.

            Для объектов направление `asc`/`desc` применяется к каждому полю.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              pattern: ^(id|name|coordinates|coordinates\.x|coordinates\.y|creationDate|area|price|numberOfRooms|new|view|transport|house|house\.name|house\.year|house\.numberOfFloors|house\.numberOfFlatsOnFloor|house\.numberOfLifts):(asc|desc)$
          example:
            - area:asc
            - name:desc
        - name: filter
          in: query
          description: |
            JSON с нужными полями, закодированный для URL.

            - Все условия должны совпасть точно; строки — с учётом регистра.
            - Вложенные поля задаются объектами, например `{"house":{"year":2000}}`.
            - Пропущенное поле не влияет на выборку; `null` выбирает записи с `null`.
            - Пустой объект не добавляет условий.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlatFilter"
              example:
                new: true
                house:
                  numberOfFloors: 5
                transport: null
      responses:
        "200":
          description: Страница квартир, возможно пустая
          headers:
            X-Total-Count:
              description: Число квартир после фильтрации, до пагинации
              schema:
                type: integer
                format: int64
                minimum: 0
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Flats
      operationId: createFlat
      summary: Добавить квартиру
      description: Создаёт квартиру из параметра `flat`. Сервер назначает `id` и дату создания.
      parameters:
        - $ref: "#/components/parameters/FlatInput"
      responses:
        "201":
          description: Квартира создана
          headers:
            Location:
              description: URI созданной квартиры, например /flats/1
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "414":
          $ref: "#/components/responses/UriTooLong"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /flats/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Flats
      operationId: getFlat
      summary: Получить квартиру по идентификатору
      description: Возвращает квартиру по `id`.
      responses:
        "200":
          $ref: "#/components/responses/FlatFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Flats
      operationId: replaceFlat
      summary: Обновить квартиру
      description: Заменяет данные квартиры значениями из `flat`, сохраняя `id` и `creationDate`.
      parameters:
        - $ref: "#/components/parameters/FlatInput"
      responses:
        "200":
          $ref: "#/components/responses/FlatFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "414":
          $ref: "#/components/responses/UriTooLong"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Flats
      operationId: deleteFlat
      summary: Удалить квартиру
      description: Удаляет квартиру по `id`.
      responses:
        "204":
          description: Квартира удалена
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /flats/min-creation-date:
    get:
      tags:
        - Statistics
      operationId: getFlatWithMinCreationDate
      summary: Получить квартиру с минимальной датой создания
      description: Возвращает одну из квартир с самой ранней `creationDate`. Если квартир нет — `404`.
      responses:
        "200":
          $ref: "#/components/responses/FlatFound"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /flats/max-new:
    get:
      tags:
        - Statistics
      operationId: getFlatWithMaxNew
      summary: Получить квартиру с максимальным значением new
      description: |
        Возвращает любую квартиру с `new=true`, а если таких нет — с `new=false`.

        Если квартир нет — `404`.
      responses:
        "200":
          $ref: "#/components/responses/FlatFound"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /flats/count-by-transport:
    get:
      tags:
        - Statistics
      operationId: countFlatsByTransport
      summary: Посчитать квартиры с заданным transport
      description: Считает квартиры с указанным `transport`. Если совпадений нет, возвращает `count=0`.
      parameters:
        - name: transport
          in: query
          required: true
          description: "JSON-значение в URL: transport=%22FEW%22 или transport=null. null отличается от NONE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transport"
              example: FEW
      responses:
        "200":
          description: Число совпадающих квартир
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - count
                properties:
                  count:
                    type: integer
                    format: int64
                    minimum: 0
              example:
                count: 3
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Идентификатор квартиры
      schema:
        $ref: "#/components/schemas/PositiveLong"
    FlatInput:
      name: flat
      in: query
      required: true
      description: |
        Данные квартиры в JSON с URL-кодированием. Тело запроса не используется.

        - `id` и `creationDate` передавать нельзя.
        - Пропущенные необязательные поля станут `null`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FlatInput"
          example:
            name: Квартира на Невском
            coordinates:
              x: 30.31
              y: 59.93
            area: 54
            price: 8500000.5
            numberOfRooms: 2
            new: false
            view: YARD
            transport: ENOUGH
            house:
              name: Дом на Невском
              year: 1905
              numberOfFloors: 5
              numberOfFlatsOnFloor: 3
              numberOfLifts: null
  responses:
    FlatFound:
      description: Данные квартиры
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Flat"
    BadRequest:
      description: Неверный формат или значение URL-параметра
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            timestamp: 2026-09-22T12:34:56.789Z
            message: Параметр sort имеет неверный формат
    UnprocessableEntity:
      description: Данные квартиры нарушают ограничения модели
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            timestamp: 2026-09-22T12:34:56.789Z
            message: numberOfRooms должно быть от 1 до 8
    NotFound:
      description: Квартира не найдена; для min-creation-date и max-new — коллекция пуста
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            timestamp: 2026-09-22T12:34:56.789Z
            message: Квартира не найдена
    UriTooLong:
      description: URL превышает допустимую длину
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            timestamp: 2026-09-22T12:34:56.789Z
            message: Слишком длинный URL
    InternalError:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            timestamp: 2026-09-22T12:34:56.789Z
            message: Внутренняя ошибка сервиса
  schemas:
    PositiveLong:
      type: integer
      format: int64
      minimum: 1
      example: 1
    PositiveInteger:
      type: integer
      format: int32
      minimum: 1
      example: 5
    NullablePositiveLong:
      type: integer
      format: int64
      minimum: 1
      nullable: true
      example: 1905
    NullablePositiveInteger:
      type: integer
      format: int32
      minimum: 1
      nullable: true
      example: 2
    FlatName:
      type: string
      minLength: 1
      description: Название квартиры
      example: Квартира на Невском
    Price:
      type: number
      minimum: 0.01
      multipleOf: 0.01
      description: Полная стоимость квартиры в рублях
      example: 8500000.5
    RoomCount:
      type: integer
      format: int32
      minimum: 1
      maximum: 8
      example: 2
    View:
      type: string
      enum:
        - YARD
        - NORMAL
        - GOOD
        - TERRIBLE
      description: Вид из окна
      example: YARD
    Transport:
      type: string
      nullable: true
      enum:
        - FEW
        - NONE
        - LITTLE
        - ENOUGH
        - null
      description: Транспортная доступность. null означает, что значение не указано.
      example: ENOUGH
    Coordinates:
      type: object
      additionalProperties: false
      required:
        - x
        - y
      properties:
        x:
          type: number
          format: float
          example: 30.31
        y:
          type: number
          format: double
          example: 59.93
    House:
      type: object
      additionalProperties: false
      required:
        - name
        - numberOfFloors
      description: Дом, в котором находится квартира
      properties:
        name:
          type: string
          example: Дом на Невском
        year:
          $ref: "#/components/schemas/NullablePositiveLong"
        numberOfFloors:
          $ref: "#/components/schemas/PositiveInteger"
        numberOfFlatsOnFloor:
          $ref: "#/components/schemas/NullablePositiveInteger"
        numberOfLifts:
          $ref: "#/components/schemas/NullablePositiveInteger"
    FlatInput:
      type: object
      additionalProperties: false
      required:
        - name
        - coordinates
        - area
        - price
        - numberOfRooms
        - new
        - view
        - house
      description: Данные для создания и обновления квартиры
      properties:
        name:
          $ref: "#/components/schemas/FlatName"
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        area:
          $ref: "#/components/schemas/PositiveLong"
        price:
          $ref: "#/components/schemas/Price"
        numberOfRooms:
          $ref: "#/components/schemas/RoomCount"
        new:
          type: boolean
          description: Новая ли квартира
          example: false
        view:
          $ref: "#/components/schemas/View"
        transport:
          $ref: "#/components/schemas/Transport"
        house:
          $ref: "#/components/schemas/House"
    Flat:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - coordinates
        - creationDate
        - area
        - price
        - numberOfRooms
        - new
        - view
        - transport
        - house
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Уникальный id, который сервер назначает при создании
          example: 1
        name:
          $ref: "#/components/schemas/FlatName"
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        creationDate:
          type: string
          format: date
          readOnly: true
          description: Дата создания (YYYY-MM-DD), назначается сервером по текущей дате
          example: 2026-09-21
        area:
          $ref: "#/components/schemas/PositiveLong"
        price:
          $ref: "#/components/schemas/Price"
        numberOfRooms:
          $ref: "#/components/schemas/RoomCount"
        new:
          type: boolean
          example: false
        view:
          $ref: "#/components/schemas/View"
        transport:
          $ref: "#/components/schemas/Transport"
        house:
          $ref: "#/components/schemas/House"
    FlatFilter:
      type: object
      additionalProperties: false
      description: Поля для фильтрации квартир
      properties:
        id:
          $ref: "#/components/schemas/PositiveLong"
        name:
          $ref: "#/components/schemas/FlatName"
        coordinates:
          type: object
          additionalProperties: false
          properties:
            x:
              type: number
              format: float
            y:
              type: number
              format: double
        creationDate:
          type: string
          format: date
        area:
          $ref: "#/components/schemas/PositiveLong"
        price:
          $ref: "#/components/schemas/Price"
        numberOfRooms:
          $ref: "#/components/schemas/RoomCount"
        new:
          type: boolean
        view:
          $ref: "#/components/schemas/View"
        transport:
          $ref: "#/components/schemas/Transport"
        house:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            year:
              $ref: "#/components/schemas/NullablePositiveLong"
            numberOfFloors:
              $ref: "#/components/schemas/PositiveInteger"
            numberOfFlatsOnFloor:
              $ref: "#/components/schemas/NullablePositiveInteger"
            numberOfLifts:
              $ref: "#/components/schemas/NullablePositiveInteger"
    Error:
      type: object
      additionalProperties: false
      required:
        - timestamp
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          pattern: Z$
          description: Время ошибки в UTC
        message:
          type: string
          description: Причина ошибки
